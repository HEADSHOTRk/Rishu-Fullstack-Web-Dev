<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS position</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            
        }
        .box{
            border: 2px solid black;
            height: 133px;
            width: 80vw;
            margin: 3px ;
            padding: 3px;
        }
        .box1{
            background-color: aqua;
            position: sticky;
            top: 0px;
            height: 111px;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        .box2{
            background-color: azure;
            top: 50px;
            bottom: 30px; 
            

        }
        .box3{
            background-color: rgb(191, 201, 98);
            color: green;
            text-shadow: 10px 15px 12px rgb(235, 13, 13);
            text-decoration: underline;
            
        }
        .box4{
            background-color: purple;
            
        }
        .parent{
            background-color: rgb(20, 237, 114);
            border: 3px solid rgb(228, 17, 17);
            margin: 34px;
            padding: 43px;
            position: absolute;
            
            
        }

        
        </style>
</head>

<body>
     <div class="parent">
        
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3">hello guys welcome back to my new session of web dev
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiOPunXDBl0HyhvVFB1UJ8lyr9AeA3j0kZZHfQCwLBBg&s=10" height="20px" width="50px" alt="git hub">
        </div>
        <div class="box box4"></div>
    </div>
  
    

</body>

</html>
