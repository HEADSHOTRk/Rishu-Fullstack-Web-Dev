<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title> 
    <style>
        .div{
            background-color: rgb(0, 253, 169);
            color: whitesmoke;

        } 
        * {
            margin:0;
            padding: 0;
        } 
        .box1{
            color: yellow;
            padding: 10px;
            margin: 35px;
            border: 2px solid black;
            height: 150px;
            box-sizing: border-box;
        }
       .box2{
            color:rgb(195, 13, 71);
            padding: 10px;
            margin: 25px;
            border: 2px solid rgb(236, 5, 5);
            height: 150px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div  class="div box1">I am a box</div>
    <div class="div box2">i am a another Box</div>
</body>
</html>
