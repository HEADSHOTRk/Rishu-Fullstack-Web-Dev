<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title> 
    <style>
        *{
            margin:0;
            padding:0;
        }
        .box{
            border:4px solid rgba(28, 228, 2, 0.822);
            display:inline-block;
            padding:45px;
            margin:10px;
            width:300px;
        } 
        .box1{
            background-color: red;
            color: white;
            
        }

    </style>
</head>
<body>
    <div class="box box1">I am Box</div>
    <div class="box">i am also a good boy</div>
    <span>I am a good</span>
    <span>Boy</span>
</body>
</html>
