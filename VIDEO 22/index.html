<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sizing Units </title>
    <style>
        *{
            margin:0
            padding:0;
        }
        .box{
            background-color: lightblue;
            color: rgb(213, 39, 39);
            border: 2px solid black;
            width: 233px;
            box-sizing: border-box;
            margin:auto;
            font-size: 1.2em;
        } 
        .container{
            background-color: lightgreen;
            color: rgb(39, 39, 213);
            border: 2px solid black;
            width: 80vw;
            margin:23px auto;
            height:80vh;
            font-size: 1em;

        }
    </style>
</head>
<body>
    <div class="box">
        <h1>CSS Sizing Units</h1>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Doloremque rerum exercitationem nobis, eveniet quibusdam cum totam fuga omnis nesciunt facere saepe aperiam iure.</p>
    </div>
    <div class="container">
        <h1>Hello, World!</h1>
    </div>
</body>
</html>
