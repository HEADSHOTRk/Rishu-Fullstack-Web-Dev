<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Lists using CSS</title>
    <style>
        nav ul li{
            list-style: georgian;
            background-color: rgb(193, 224, 15);
            list-style-position: inside;
            border: 2px solid black;
           list-style-type: "✌️❤️";
           display: flex;
        

        }  
        
        
    </style>
</head>

<body>
<img src="Rishabh profile img.jpeg" width="50px" height="50px">

    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>

</html>
