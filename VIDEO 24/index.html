<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <style>
        .box{
            border:2px solid blue;
            margin: 0;
            padding: 34px;
            box-shadow: 4px 12px 33px rgb(0, 226, 155);

        }
        .element{
            text-shadow: 2px 2px 4px rgb(231, 24, 41);
        }

    </style>
</head>
<body>
    <div class="box">i am shadow</div>
    <p class="element">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nostrum distinctio sapiente fugit autem culpa quo, voluptatem necessitatibus quae perferendis consectetur ipsum earum vel cupiditate, reiciendis odio corporis dicta, enim dolor.</p>
</body>
</html>
